name: client-check

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client-check.yml'
  pull_request:
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: cargo check
        working-directory: client
        run: |
          set +e
          cargo check --workspace --message-format=short > /tmp/check.log 2>&1
          code=$?
          tail -5 /tmp/check.log
          if [ "$code" -ne 0 ]; then
            echo "CHECK_FAILED=true" >> "$GITHUB_ENV"
          fi
          exit "$code"

      # The sandbox running this agent cannot download Actions logs, so mirror
      # the failure output into check annotations (readable via the API).
      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "^error|: error: " /tmp/check.log | head -10 | while IFS= read -r line; do
            line=$(printf '%s' "$line" | head -c 1500 | sed 's/%/%25/g')
            echo "::error::$line"
          done
          echo "--- last 5 lines of check.log ---"
          tail -5 /tmp/check.log
