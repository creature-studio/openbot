name: client-check

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client-check.yml'
  pull_request:
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: cargo check
        working-directory: client
        run: cargo check --workspace > /tmp/check.log 2>&1

      # The sandbox running this agent cannot download Actions logs, so mirror
      # the failure output into check annotations (readable via the API).
      - name: Report failure head
        if: failure()
        run: |
          n=$(wc -l < /tmp/check.log)
          echo "::error::cargo check failed, check.log has $n lines. First lines:"
          head -9 /tmp/check.log | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | head -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::[head] $safe"
          done

      - name: Report failure tail
        if: failure()
        run: |
          tail -9 /tmp/check.log | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | head -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::[tail] $safe"
          done
