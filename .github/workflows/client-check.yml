name: client-check

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client-check.yml'
  pull_request:
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: cargo check
        working-directory: client
        run: cargo check --workspace > /tmp/check.log 2>&1

      # The sandbox running this agent cannot download Actions logs, so mirror
      # the failure output into check annotations (readable via the API).
      # Cargo prints errors last, so report the tail: covers short resolution
      # logs whole and the error region of long compile logs.
      - name: Report error summary
        if: failure()
        run: |
          n=$(wc -l < /tmp/check.log)
          echo "::error::cargo check failed, check.log has $n lines. Errors:"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/check.log | grep -E "^error(\[|:)|^ *--> " | head -9 | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | head -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::[err] $safe"
          done

      - name: Report tail part 1/3
        if: failure()
        run: |
          tail -27 /tmp/check.log | sed -n '1,9p' | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/\x1b\[[0-9;]*m//g' | head -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::[t1] $safe"
          done

      - name: Report tail part 2/3
        if: failure()
        run: |
          tail -27 /tmp/check.log | sed -n '10,18p' | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/\x1b\[[0-9;]*m//g' | head -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::[t2] $safe"
          done

      - name: Report tail part 3/3
        if: failure()
        run: |
          tail -27 /tmp/check.log | sed -n '19,27p' | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/\x1b\[[0-9;]*m//g' | head -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::[t3] $safe"
          done
