name: client-check

on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client-check.yml'
  pull_request:
    paths:
      - 'client/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: cargo check
        working-directory: client
        run: cargo check --workspace > /tmp/check.log 2>&1

      # The sandbox running this agent cannot download Actions logs, so mirror
      # the failure output into check annotations (readable via the API).
      - name: Report failure lines 1-9
        if: failure()
        run: |
          n=$(wc -l < /tmp/check.log)
          echo "::error::cargo check failed, check.log has $n lines."
          sed -n '1,9p' /tmp/check.log | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/\x1b\[[0-9;]*m//g' | head -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::[$n] $safe"
          done

      - name: Report failure lines 10-18
        if: failure()
        run: |
          sed -n '10,18p' /tmp/check.log | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/\x1b\[[0-9;]*m//g' | head -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::[mid] $safe"
          done

      - name: Report failure lines 19-27
        if: failure()
        run: |
          sed -n '19,27p' /tmp/check.log | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | sed 's/\x1b\[[0-9;]*m//g' | head -c 1200 | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error::[19+] $safe"
          done
