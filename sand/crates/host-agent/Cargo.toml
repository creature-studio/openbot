[package]
name = "host-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "host-agent"
path = "src/main.rs"

[dependencies]
sand-client = { path = "../sand-client" }
sand-protocol = { path = "../sand-protocol" }
spark-transport = { path = "../../client/crates/spark-transport" }
spark-model = { path = "../../client/crates/spark-model" }

tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tracing = "0.1"
async-trait = "0.1"
