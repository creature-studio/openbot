[workspace]
members = [
    "crates/spark-client",
    "crates/spark-ui",
    "crates/spark-model",
    "crates/spark-transport",
    "crates/spark-terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# GPUI — date-tagged mirror of Zed's GPUI crates (lighter than cloning all of
# github.com/zed-industries/zed; see https://github.com/realab/gpui-standalone).
# Tag 2026-09-14 == Zed main @ ba7da93e5ccc2b630077b2ae26c7581f3c21f984.
# Cargo pins the resolved mirror commit in Cargo.lock; bump the tag to update.
# NOTE: third-party mirror — audit before trusting new tags in releases.
gpui = { git = "https://github.com/realab/gpui-standalone.git", tag = "2026-09-14" }
# Platform backends (windowing + text). ["font-kit", "wayland", "x11"] is the
# safe cross-platform default per crates/gpui/README.md in the mirror.
gpui_platform = { git = "https://github.com/realab/gpui-standalone.git", tag = "2026-09-14", features = ["font-kit", "wayland", "x11"] }

# Model / Transport
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
dashmap = "6"

# Terminal (VT parser)
alacritty_terminal = "0.25"
